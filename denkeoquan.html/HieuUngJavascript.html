
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đèn kéo quân - Mã Thị Kim Thoa</title>

<style>
body {
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    color: gold;
    margin-top: 40px;
}

.scene {
    width: 220px;
    height: 280px;
    margin: 100px auto;
    perspective: 900px;
}

.carousel {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: quay 12s linear infinite;
}

.carousel:hover {
    animation-play-state: paused;
}

.face {
    position: absolute;
    width: 200px;
    height: 260px;
    left: 10px;
    top: 10px;
    border: 3px solid gold;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 15px gold;
}

.face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.face:nth-child(1) {
    transform: rotateY(0deg) translateZ(190px);
}

.face:nth-child(2) {
    transform: rotateY(60deg) translateZ(190px);
}

.face:nth-child(3) {
    transform: rotateY(120deg) translateZ(190px);
}

.face:nth-child(4) {
    transform: rotateY(180deg) translateZ(190px);
}

.face:nth-child(5) {
    transform: rotateY(240deg) translateZ(190px);
}

.face:nth-child(6) {
    transform: rotateY(300deg) translateZ(190px);
}

@keyframes quay {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(360deg);
    }
}

button {
    padding: 12px 25px;
    background: gold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

a {
    color: yellow;
}
</style>
</head>

<body>

<h1>ĐÈN KÉO QUÂN 3D</h1>

<p>Đưa chuột vào hình ảnh để dừng đèn.</p>
<p>Rê chuột ra ngoài để đèn tiếp tục quay.</p>

<div class="scene">
    <div class="carousel">

        <div class="face">
            <img src="avatar1.jpg" alt="Ảnh 1">
        </div>

        <div class="face">
            <img src="avatar2.jpg" alt="Ảnh 2">
        </div>

        <div class="face">
            <img src="avatar3.jpg" alt="Ảnh 3">
        </div>

        <div class="face">
            <img src="avatar4.jpg" alt="Ảnh 4">
        </div>

        <div class="face">
            <img src="avatar5.jpg" alt="Ảnh 5">
        </div>

        <div class="face">
            <img src="avatar6.jpg" alt="Ảnh 6">
        </div>

    </div>
</div>
</body>

</a>
</html>
