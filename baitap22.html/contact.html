  <main class="page-main">
    <section class="section narrow">
      <div class="section-heading reveal"><p class="eyebrow">GET IN TOUCH</p><h1>Liên hệ với mình</h1><p>Điền thông tin bên dưới để gửi lời nhắn. Form sẽ hoạt động sau khi bạn thay endpoint Formspree của mình.</p></div>
      <form class="contact-form reveal" action="https://formspree.io/f/xljbozzw" method="POST">
        <label for="name">Họ và tên</label><input id="name" name="name" type="text" placeholder="Nhập họ và tên" required>
        <label for="email">Email</label><input id="email" name="email" type="email" placeholder="name@example.com" required>
        <label for="message">Nội dung</label><textarea id="message" name="message" rows="6" placeholder="Bạn muốn nhắn điều gì?" required></textarea>
        <button class="button" type="submit">Gửi liên hệ</button>
        <p class="form-note">Gửi tới:Kim Thoaa .</p>
      </form>
    </section>
